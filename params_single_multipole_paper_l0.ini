[params]
## Paper-ready fixed-L single-multipole production run for L=0.
## This mode collapses over the m-modes analytically and samples only
## log_Np, log_Na, alpha, and log_A_L for one chosen multipole L.
## It does NOT sample individual b_lm coefficients and does NOT reconstruct a sky map.

## Frequency band chosen to focus on the mHz region where the LISA response is informative
## and where the baseline single-multipole tests in this repository were most stable.
fmin=4e-4
fmax=3e-3

## Longer observation for steadier posteriors, while staying within the current BLIP workflow.
duration=2e6

## FFT segment length used by the existing production examples.
seglen=1e5

## Sampling rate in Hz.
fs=0.25

Shfile=LISA_2017_PSD_M.npy

## Healpix resolution used in the anisotropic response integration.
## nside=4 is a reasonable production compromise for the fixed-L mode.
nside=4

## Start time in seconds. Determines the starting orbital phase of LISA.
tstart = 0

## Orbiting LISA and orthogonal TDI channels are recommended for publication-quality runs.
lisa_config=orbiting
tdi_lev=aet

## If load_data=1, BLIP reads an external time series instead of generating an injection.
## This file is set up for an injection-recovery study suitable for a paper methods/results section.
load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain

## Reference frequency for the power-law amplitude.
fref = 1e-3


## Recovery model: noise + one fixed multipole total-power SGWB component.
model=noise+powerlaw_multipole

## Model/Injection aliasing
alias={'powerlaw_multipole':'powerlaw_multipole'}

## Legacy spherical-harmonic bookkeeping.
## In the fixed-L route, the physically relevant knob is multipole_l below.
## lmax is retained only for compatibility with BLIP's internal setup.
lmax = 1

## Chosen fixed multipole for the paper run.
multipole_l = 0


[inj]
## Enable injection generation.
doInj=1

## Inject the same model family that is recovered.
injection=noise+powerlaw_multipole

## Keep the legacy spherical-harmonic injection bookkeeping minimal in the fixed-L route.
## The actual injected multipole is controlled by multipole_l below.
inj_lmax = 0

## Set explicitly so the run is fully self-documenting.
multipole_l = 0

## Baseline production injection.
## This is intentionally not the stronger debug signal: it is more appropriate for a paper-quality recovery study.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_multipole':{'alpha':0.667,'A_L':2e-7}
           }


[priors]
## Moderately informative, physically sensible priors.
## These are narrower than the legacy defaults but still broad enough for inference.
## They are intended to reduce prior-volume dilution without effectively fixing the answer.
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]
alpha=[-1.0,2.5]
log_A_L=[-9.5,-5.5]


[run_params] # Parameters related to the run or to the sampler

## Dynesty nested sampling is the preferred backend here because it returns both
## posterior samples and the Bayesian evidence for paper-level model comparison.
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma

## Higher live-point count than the tuned production examples for steadier posteriors
## and more defensible evidence estimates in a paper context.
nlive=1000

## Leave this at 1 unless you have benchmarked a clear gain in your environment.
Nthreads=1

## Reproducible run.
FixSeed=1
seed=42
input_spectrum=data_spectrum.npz

## Checkpointing is enabled for a long production run.
checkpoint=1
checkpoint_interval=1800

## Robust nested-sampling proposal for this low-dimensional but mildly curved posterior.
sample_method=rslice

## Output directory.
out_dir=./Storage/single_multipole_paper_l0/
