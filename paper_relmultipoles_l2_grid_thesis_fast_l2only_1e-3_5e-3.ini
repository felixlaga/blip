[params]
## Thesis-speed L2-only counterpart to paper_relmultipoles_l2_grid_thesis_fast.ini.
## Use with:
## python blip/tools/run_relmultipoles_paper_grid.py paper_relmultipoles_l2_grid_thesis_fast_l2only_1e-3_5e-3.ini
##
## This duplicates the thesis-fast grid workflow, but removes all nuisance
## multipoles from the injected datasets. The five generated datasets are:
## - one isotropic baseline with no injected L=2 multipole
## - four datasets with only the injected L=2 relative amplitude ramped up

fmin=1e-3
fmax=5e-3

## Four-year observation for stronger injected/recovered SNR in the thesis sweep.
duration=1.26144e8

## Use the established long-run production cadence already present elsewhere in the repo.
seglen=1e5
## Keep the Nyquist comfortably above the analysis band while reducing time-series cost.
fs=0.02

Shfile=LISA_2017_PSD_M.npy

## Higher-resolution response integration requested for this duplicated workflow.
nside=4
tstart = 0

lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain

## Paper reference frequency at 2.5 mHz.
fref = 2.5e-3

model=noise+powerlaw_relmultipoles
alias={'powerlaw_relmultipoles':'powerlaw_relmultipoles'}

## No nuisance injected multipoles: only L=2 participates in the ramped datasets.
lmax = 2
multipole_ls = [2]


[inj]
doInj=1
injection=noise+powerlaw_relmultipoles
multipole_ls = [2]
inj_lmax = 2

truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_relmultipoles':{'alpha':0.667,
                                      'omega0':1e-10,
                                      'log_A_ratio_by_L':{2:-2.0}}
           }


[priors]
## Narrower than the smoke setup, but still safely wider than the injected values.
log_Np=[-41.8,-40.2]
log_Na=[-49.2,-47.7]
alpha=[-0.5,1.5]
log_omega0=[-11.0,-9.0]
log_A_ratio=[-3.8,-0.3]


[run_params]
sampler=dynesty
verbose=1
doPreProc=1
generate_only=1
## Skip sweep-wide diagnostic / posterior plotting; the launcher re-enables
## diagnostics for the final shared dataset and full plotting for the final
## null and alt recoveries so you still get the thesis outputs where needed.
skip_diagnostics=1
skip_postprocessing=1
projection=E
colormap=magma

## Keep this laptop-friendly while still allowing parallel response work.
nlive=192
Nthreads=4
FixSeed=1
seed=200
input_spectrum=data_spectrum.npz
checkpoint=0
checkpoint_interval=1800
sample_method=rslice
response_time_chunk=256
response_storage_dtype=complex64
out_dir=./Storage/paper_relmultipoles_l2_grid_thesis_fast_l2only_1e-3_5e-3/


[paper_grid]
target_multipole_l = 2
a_ratio_grid = [1e-2,2e-2,1e-1,2e-1]
include_zero_baseline = 1
seed_start = 200
final_dataset_full_plots = 1
