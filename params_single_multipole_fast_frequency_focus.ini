[params]
## Fast debugging run to test whether a narrower mHz band helps break the alpha-amplitude degeneracy.
## Relative to the strong-signal debug file: same stronger injection and free alpha, but a tighter frequency window.
fmin=8e-4
fmax=1.8e-3
## Keep the runtime short.
duration=4e5
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=1
tstart = 0

lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain

# Reference frequency chosen inside the narrowed analysis band.
fref = 1e-3


## Recovery Model description
model=noise+powerlaw_multipole

## Model/Injection aliasing
alias={'powerlaw_multipole':'powerlaw_multipole'}

## Legacy spherical-harmonic bookkeeping.
lmax = 1
multipole_l = 2


[inj]
## Injections
doInj=1

## Injection model description
injection=noise+powerlaw_multipole

## Same strong-signal injection used for the main debug runs.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_multipole':{'alpha':0.667,'A_L':2e-6}
           }


[priors]
## Keep the same moderate debug priors as the strong-signal run.
log_Np=[-43.0,-40.0]
log_Na=[-49.8,-47.0]
alpha=[-1.0,2.5]
log_A_L=[-9.0,-5.0]


[run_params] # Parameters related to the run or to the sampler

## Short runtime for band-selection debugging.
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma
nlive=100
Nthreads=1

## Reproducible run
FixSeed=1
seed=42
input_spectrum=data_spectrum.npz

## Checkpointing and restarting (dynesty only)
checkpoint=0
checkpoint_interval=600

## Sampling method (dynesty only)
sample_method=rwalk

## output directory
out_dir=./Storage/single_multipole_fast_frequency_focus/
