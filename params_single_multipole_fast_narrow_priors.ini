[params]
## Fast debugging run to test whether prior volume is driving the broad posteriors.
## Relative to the strong-signal debug file: same stronger injection and same L=2 model, but narrower priors.
## Alpha remains free in this run.
fmin=5e-4
fmax=3e-3
duration=4e5
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=1
tstart = 0

lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain

# Keep the amplitude normalization near the informative part of the band.
fref = 1e-3


## Recovery Model description
model=noise+powerlaw_multipole

## Model/Injection aliasing
alias={'powerlaw_multipole':'powerlaw_multipole'}

## Legacy spherical-harmonic bookkeeping.
lmax = 1
multipole_l = 2


[inj]
## Injections
doInj=1

## Injection model description
injection=noise+powerlaw_multipole

## Same stronger-than-baseline debug injection.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_multipole':{'alpha':0.667,'A_L':2e-6}
           }


[priors]
## Narrower priors to test whether the broad default prior volume is masking recovery.
## Noise priors are tightened modestly around the injected values.
log_Np=[-42.0,-40.3]
log_Na=[-49.2,-47.8]
alpha=[0.0,1.5]
log_A_L=[-6.8,-5.2]


[run_params] # Parameters related to the run or to the sampler

## Short runtime for diagnosis.
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma
nlive=100
Nthreads=1

## Reproducible run
FixSeed=1
seed=42
input_spectrum=data_spectrum.npz

## Checkpointing and restarting (dynesty only)
checkpoint=0
checkpoint_interval=600

## Sampling method (dynesty only)
sample_method=rwalk

## output directory
out_dir=./Storage/single_multipole_fast_narrow_priors/
