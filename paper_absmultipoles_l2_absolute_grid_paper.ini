[params]
## Absolute-amplitude paper grid for the current relmultipoles workflow.
## This file reproduces the four nonzero paper datasets and their matched
## null/alt recoveries, but expresses the target L=2 scan in absolute A_2.
##
## Use with:
## MPLCONFIGDIR=/tmp/mpl python blip/tools/run_relmultipoles_threshold.py paper_absmultipoles_l2_absolute_grid_paper.ini
##
## Notes:
## - The underlying shared-spectrum relmultipoles physics is intentionally preserved.
## - The threshold launcher is used here with n_realizations = 1 so it behaves like
##   a four-dataset paper grid over absolute A_2 values.

## Frequency band widened so the chosen reference frequency sits inside the analyzed band.
fmin=4e-4
fmax=5e-3

## Three-year observation to keep the dense shared-data injection within workstation RAM.
duration=9.4608e7

## Use the established long-run production cadence already present elsewhere in the repo.
seglen=1e5
fs=0.25

Shfile=LISA_2017_PSD_M.npy
nside=4
tstart = 0

lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 2.5e-3

model=noise+powerlaw_relmultipoles
alias={'powerlaw_relmultipoles':'powerlaw_relmultipoles'}

## Trim nuisance injections to L <= 6 for a lighter paper-scale workflow.
lmax = 6
multipole_ls = [1,2,3,4,5,6]


[inj]
doInj=1
injection=noise+powerlaw_relmultipoles
multipole_ls = [1,2,3,4,5,6]
inj_lmax = 6

## Physical amplitudes are kept matched to the existing paper setup:
## A_0 = 1e-10
## A_1 = A_3 = A_4 = A_5 = A_6 = 1e-13
## The threshold section below rewrites A_2 over an absolute grid:
## [1e-12, 2e-12, 1e-11, 2e-11].
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_relmultipoles':{'alpha':0.667,
                                      'omega0':1e-10,
                                      'log_A_ratio_by_L':{1:-3.0,2:-2.0,3:-3.0,4:-3.0,5:-3.0,6:-3.0}}
           }


[priors]
log_Np=[-41.8,-40.2]
log_Na=[-49.2,-47.7]
alpha=[-0.5,1.5]
log_omega0=[-11.0,-9.0]
log_A_ratio=[-3.8,-0.3]


[run_params]
sampler=dynesty
verbose=1
doPreProc=1
generate_only=1

## Lighten the workflow a bit: skip plots/products that are not needed for the grid logic,
## reduce live points, and allow a slightly larger response chunk.
skip_diagnostics=1
skip_postprocessing=1
projection=E
colormap=magma
nlive=500
Nthreads=1
FixSeed=1
seed=201
input_spectrum=data_spectrum.npz
checkpoint=1
checkpoint_interval=1800
sample_method=rslice
response_time_chunk=384
response_storage_dtype=complex64
out_dir=./Storage/paper_absmultipoles_l2_grid_paper/


[threshold]
target_multipole_l = 2

## Absolute target amplitudes for the L=2 scan:
## these correspond exactly to the old ratio grid [1e-2, 2e-2, 1e-1, 2e-1]
## with omega0 = 1e-10.
A_L_grid = [1e-12,2e-12,1e-11,2e-11]

## Use the threshold launcher as a one-realization absolute grid generator.
n_realizations = 1
seed_start = 201

## Match the current paper-grid recovery structure:
## null = isotropic only, alt = isotropic + target L=2 only.
null_multipole_ls = []
alt_multipole_ls = [2]

## These are largely bookkeeping when n_realizations = 1, but keep them explicit.
evidence_threshold = 5.0
efficiency_target = 1.0
