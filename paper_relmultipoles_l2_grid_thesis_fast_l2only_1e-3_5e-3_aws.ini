[params]
## AWS-optimized L2-only thesis-fast relative-multipole workflow.
## Recommended EC2 instance: c8i.4xlarge, c7i.4xlarge, or c6i.4xlarge.
## Run with:
## MPLCONFIGDIR=/tmp/mpl python blip/tools/run_relmultipoles_paper_grid.py paper_relmultipoles_l2_grid_thesis_fast_l2only_1e-3_5e-3_aws.ini

fmin=1e-3
fmax=5e-3

duration=1.26144e8
seglen=1e5
fs=0.02

Shfile=LISA_2017_PSD_M.npy

nside=4
tstart = 0

lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 2.5e-3

model=noise+powerlaw_relmultipoles
alias={'powerlaw_relmultipoles':'powerlaw_relmultipoles'}

## No nuisance injected multipoles: only L=2 participates in the ramped datasets.
lmax = 2
multipole_ls = [2]


[inj]
doInj=1
injection=noise+powerlaw_relmultipoles
multipole_ls = [2]
inj_lmax = 2

truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_relmultipoles':{'alpha':0.667,
                                      'omega0':1e-10,
                                      'log_A_ratio_by_L':{2:-2.0}}
           }


[priors]
log_Np=[-41.8,-40.2]
log_Na=[-49.2,-47.7]
alpha=[-0.5,1.5]
log_omega0=[-11.0,-9.0]
log_A_ratio=[-3.8,-0.3]


[run_params]
sampler=dynesty
verbose=1
doPreProc=1
generate_only=1
skip_diagnostics=1
skip_postprocessing=1
projection=E
colormap=magma

## 16 worker processes matches a c*.4xlarge instance. Keep BLAS threads at 1 in the shell.
nlive=192
Nthreads=16
FixSeed=1
seed=200
input_spectrum=data_spectrum.npz

## AWS safety: lets you resume individual interrupted recovery runs.
checkpoint=1
checkpoint_interval=600

sample_method=rslice
response_time_chunk=256
response_storage_dtype=complex64
out_dir=./Storage/paper_relmultipoles_l2_grid_thesis_fast_l2only_1e-3_5e-3_aws/


[paper_grid]
target_multipole_l = 2
a_ratio_grid = [1e-2,2e-2,1e-1,2e-1]
include_zero_baseline = 1
seed_start = 200

## Keep full corner/fit products only for the final shared dataset and final recoveries.
final_dataset_full_plots = 1
