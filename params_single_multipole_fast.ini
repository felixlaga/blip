[params]
## General run parameters
fmin=5e-4
fmax=2e-3
## Duration in seconds, chosen to keep this example cheap to run
duration=1.5e5
## Segment length for fft in seconds
seglen=5e4
## Sample rate in Hz
fs=0.1
Shfile=LISA_2017_PSD_M.npy
## Healpix nside used for the anisotropic response integration
nside=2
## Start time in seconds. Determines starting orbital position.
tstart = 0

## LISA configuration. Can be stationary or orbiting
lisa_config=orbiting

## Level of the tdi. Can be michelson, xyz or aet
tdi_lev=xyz

# If the load_data flag is set to 1, then the time series data is read in from a file.
load_data=0
datafile=mldc_tdi_withnoise.txt

# Doppler or strain data. MLDC data is doppler, autogenerated data is strain. Can be doppler or strain.
datatype=strain

# Reference frequency for the power law amplitude
fref = 1e-3


## Recovery Model description
# This first-pass mode keeps one fixed multipole L and infers only its total power amplitude.
model=noise+powerlaw_multipole

## Model/Injection aliasing
alias={'powerlaw_multipole':'powerlaw_multipole'}

## Legacy spherical-harmonic bookkeeping.
## The fixed single multipole for this run is controlled by multipole_l.
lmax = 1
multipole_l = 2


[inj]
## Injections
doInj=1

## Injection model description
injection=noise+powerlaw_multipole

## If inj.multipole_l is omitted, the injection reuses params.multipole_l.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_multipole':{'alpha':2.0,'A_L':2e-7}
           }


[priors]
## Uniform prior bounds for the sampled parameters
log_Np=[-42.5,-40.0]
log_Na=[-49.5,-47.0]
alpha=[-3.0,3.0]
log_A_L=[-11.0,-6.0]


[run_params] # Parameters related to the run or to the sampler

## Sampler to use. Supported: dynesty, emcee, nessai
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma
nlive=80
Nthreads=1

## Reproducible run
FixSeed=1
seed=42
input_spectrum=data_spectrum.npz

## Checkpointing and restarting (dynesty only)
checkpoint=0
checkpoint_interval=600

## Sampling method (dynesty only)
sample_method=rwalk

## output directory
out_dir=./Storage/single_multipole_fast/
