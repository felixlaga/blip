[params]
## Recover the already-generated shared-spectrum dataset with one shared
## isotropic spectrum plus a single relative L=2 multipole.

fmin=4e-4
fmax=3e-3
duration=3e6
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=4
tstart = 0
lisa_config=orbiting
tdi_lev=aet

## Reuse the cached spectrum from the interrupted injection run.
load_data=1
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 1e-3

model=noise+powerlaw_relmultipole
alias={'powerlaw_relmultipole':'powerlaw_multipoles'}

lmax = 10
multipole_l = 2


[inj]
## No new injection here; reuse the cached frequency-domain dataset.
doInj=0


[priors]
log_Np=[-43.5,-39.5]
log_Na=[-50.0,-47.0]
alpha=[-1.0,2.5]
log_omega0=[-10.0,-5.0]
log_A_ratio=[-2.0,2.0]


[run_params]
sampler=dynesty
verbose=1
## Do not regenerate preprocessing products; read the cached spectrum.
doPreProc=0
projection=E
colormap=magma
nlive=1000
Nthreads=1
FixSeed=1
seed=42

input_spectrum=./Storage/shared_multipoles_l10_shared_alpha_l2/shared_multipoles_l10_shared_alpha_l2_spectrum.npz

checkpoint=1
checkpoint_interval=1800
sample_method=rslice

out_dir=./Storage/iso_plus_l2_shared_alpha_from_multipoles_l10_recover/
