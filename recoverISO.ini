[params]
fmin=4e-4
fmax=3e-3
duration=3e5
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=1
tstart = 0
lisa_config=orbiting
tdi_lev=aet

load_data=1
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 1e-3

model=noise+powerlaw_isgwb
alias={'powerlaw_isgwb':'powerlaw_isgwb'}

lmax = 2


[inj]
doInj=0


[priors]
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]
alpha=[-1.0,2.5]
log_omega0=[-10.0,-5.0]


[run_params]
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma
nlive=150
Nthreads=1
FixSeed=1
seed=42
input_spectrum=./Storage/inject_iso_plus_L2_fast/shared_spectrum_L2_fast.npz
checkpoint=0
sample_method=rslice
out_dir=./Storage/recover_isotropic_only_from_L2inj_fast/