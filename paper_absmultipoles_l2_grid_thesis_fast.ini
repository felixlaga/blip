[params]
## Thesis-speed absolute-amplitude counterpart to paper_absmultipoles_l2_grid_paper.ini.
##
## Relative workflow:
## MPLCONFIGDIR=/tmp/mpl python blip/tools/run_relmultipoles_paper_grid.py paper_relmultipoles_l2_grid_thesis_fast.ini
##
## Absolute workflow:
## MPLCONFIGDIR=/tmp/mpl python blip/tools/run_absmultipoles_paper_grid.py paper_absmultipoles_l2_grid_thesis_fast.ini
##
## This remains the native full-dataset absolute workflow:
## - 5 complete shared datasets are generated directly
## - each dataset is recovered with the null and alt models
## - only the final dataset's null and alt recoveries keep full plotting outputs

## Frequency band widened so the chosen reference frequency sits inside the analyzed band.
fmin=4e-4
fmax=5e-3

## Shorten the observation substantially so the full 5-dataset / 10-recovery sweep
## stays practical for thesis iteration while preserving the paper band and model family.
duration=2e6

## Use the established long-run production cadence already present elsewhere in the repo.
seglen=1e5
fs=0.25

Shfile=LISA_2017_PSD_M.npy

## Keep better-than-smoke angular resolution without paying the full paper cost.
nside=2
tstart = 0

lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain

## Paper reference frequency at 2.5 mHz.
fref = 2.5e-3

## Native full-dataset absolute model family.
model=noise+powerlaw_absmultipoles
alias={'powerlaw_absmultipoles':'powerlaw_absmultipoles'}

## The injected full absolute multipole set.
lmax = 6
multipole_ls = [1,2,3,4,5,6]


[inj]
## These truevals define the full injected absolute dataset family.
doInj=1
injection=noise+powerlaw_absmultipoles
multipole_ls = [1,2,3,4,5,6]
inj_lmax = 6

truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_absmultipoles':{'alpha':0.667,
                                      'omega0':1e-10,
                                      'A_L_by_L':{1:1e-13,2:1e-12,3:1e-13,4:1e-13,5:1e-13,6:1e-13}}
           }


[absolute_injection]
## Legacy component-workflow section retained for compatibility with the old launcher branch.
## The native full-dataset workflow above uses [inj] truevals instead.
multipole_ls = [1,2,3,4,5,6]

## Keep the physical amplitudes matched to the current relative paper setup:
## A_0 = 1e-10
## A_1 = A_3 = A_4 = A_5 = A_6 = 1e-13
## A_2 is overwritten by the paper grid below on a per-dataset basis.
A_L_by_L = {1:1e-13,2:1e-12,3:1e-13,4:1e-13,5:1e-13,6:1e-13}

## Use the same spectral slope for all absolute multipole components.
alpha = 0.667

## Per-L component seeds are offset from the dataset seed by this stride so the
## isolated absolute multipole draws remain independent of one another.
component_seed_stride = 100


[priors]
## Preserve the current paper noise/isotropic priors, and use an absolute A_L prior
## wide enough to cover the full paper scan while remaining much narrower than the
## legacy single-multipole examples.
log_Np=[-41.8,-40.2]
log_Na=[-49.2,-47.7]
alpha=[-0.5,1.5]
log_omega0=[-11.0,-9.0]
log_A_L=[-14.0,-10.0]


[run_params]
sampler=dynesty
verbose=1
doPreProc=1
generate_only=1
## Skip sweep-wide diagnostic / posterior plotting; the launcher re-enables
## diagnostics for the final shared dataset and full plotting for the final
## null and alt recoveries so you still get the thesis outputs where needed.
skip_diagnostics=1
skip_postprocessing=1
projection=E
colormap=magma

## Middle-ground nested sampling budget for thesis figures and Bayes-factor trends.
nlive=256
Nthreads=1
FixSeed=1
seed=200
input_spectrum=data_spectrum.npz
checkpoint=0
checkpoint_interval=1800
sample_method=rslice
response_time_chunk=256
response_storage_dtype=complex64
out_dir=./Storage/paper_absmultipoles_l2_grid_thesis_fast/


[paper_grid]
workflow_mode = full_dataset
target_multipole_l = 2

## Exact absolute counterparts to the old ratio grid [1e-2, 2e-2, 1e-1, 2e-1]
## with omega0 = 1e-10.
A_L_grid = [1e-12,2e-12,1e-11,2e-11]

include_zero_baseline = 1
seed_start = 200
final_dataset_full_plots = 1
