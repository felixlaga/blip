[params]
## Baseline smoke recovery:
##   recover only noise + isotropic SGWB from the matched relmultipoles injection.

fmin=4e-4
fmax=2e-3
duration=6e4
seglen=1.5e4
fs=0.1

Shfile=LISA_2017_PSD_M.npy
nside=1
tstart = 0

lisa_config=orbiting
tdi_lev=aet

load_data=1
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 1e-3

model=noise+powerlaw_isgwb
alias={'powerlaw_isgwb':'powerlaw_relmultipoles'}

lmax = 10


[inj]
doInj=0


[priors]
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]
alpha=[-1.0,2.5]
log_omega0=[-10.0,-5.0]


[run_params]
sampler=dynesty
verbose=1
doPreProc=0
generate_only=0
skip_diagnostics=0
skip_postprocessing=0
projection=E
colormap=magma
nlive=64
Nthreads=1
FixSeed=1
seed=41
input_spectrum=./Storage/paper_relmultipoles_smoke/shared_data/data_spectrum.npz
checkpoint=0
sample_method=rslice
out_dir=./Storage/paper_relmultipoles_smoke/baseline_isotropic/
