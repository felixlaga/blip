[params]
## Reuse one shared all-multipole absolute-amplitude dataset and recover only L=0 plus L=4.

fmin=4e-4
fmax=3e-3
duration=2e6
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=4
tstart = 0
lisa_config=orbiting
tdi_lev=aet

load_data=1
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 2.5e-02

model=noise+powerlaw_isgwb+powerlaw_multipole
alias={'powerlaw_isgwb':'powerlaw_fixedmultipoles',
        'powerlaw_multipole':'powerlaw_fixedmultipoles'}

lmax = 10
multipole_l = 4


[inj]
## Reuse the shared dataset written by params_fixedl_iso_only_from_all_fixedmultipoles_l10.ini.
doInj=0


[priors]
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]
alpha=[-1.0,2.5]
log_omega0=[-12.0,-9.0]
log_A_L=[-15.0,-11.0]


[run_params]
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma
nlive=1000
Nthreads=1
FixSeed=1
seed=42

input_spectrum=./Storage/fixedl_iso_plus_one_from_all_fixedmultipoles_l10/shared_data/shared_all_fixedmultipoles_l10_spectrum.npz

checkpoint=1
checkpoint_interval=1800
sample_method=rslice

out_dir=./Storage/fixedl_iso_plus_one_from_all_fixedmultipoles_l10/recover_l04/
