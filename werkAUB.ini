[params]
## L=2 anisotropy injection on top of an isotropic SGWB.
## This file generates one mock dataset with:
##   noise + isotropic SGWB + quadrupole (L=2)
## and recovers with the same signal family.

## Frequency band
fmin=4e-4
fmax=3e-3

## Observation time
duration=2e6

## FFT segment length
seglen=1e5

## Sampling rate
fs=0.25

Shfile=LISA_2017_PSD_M.npy

## Angular resolution for response integration
nside=4

## Start time
tstart = 0

## LISA setup
lisa_config=orbiting
tdi_lev=aet

## Generate fake data internally
load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain

## Reference frequency
fref = 1e-3


## Recovery model:
## noise + isotropic SGWB + one fixed-L multipole component
model=noise+powerlaw_isgwb+powerlaw_multipole

## Alias bookkeeping
alias={'powerlaw_isgwb':'powerlaw_isgwb',
       'powerlaw_multipole':'powerlaw_multipole'}

## Keep this at least as large as the injected multipole
lmax = 2

## Recovered multipole
multipole_l = 2


[inj]
## Generate injection
doInj=1

## Inject the same signal family:
## noise + isotropic background + L=2 anisotropy
injection=noise+powerlaw_isgwb+powerlaw_multipole

## Injected multipole
multipole_l = 2

## True injected values
## omega0 = isotropic SGWB amplitude
## A_L    = anisotropic L=2 amplitude
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_isgwb':{'alpha':0.667,'omega0':5e-8},
            'powerlaw_multipole':{'alpha':0.667,'A_L':2e-7}
           }


[priors]
## Noise priors
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]

## Shared SGWB spectral slope prior
alpha=[-1.0,2.5]

## Isotropic amplitude prior
log_omega0=[-10.0,-5.0]

## L=2 anisotropy amplitude prior
log_A_L=[-9.5,-5.5]


[run_params]
sampler=dynesty
verbose=1

## Force regeneration of the mock spectrum for this exact injection
doPreProc=1

projection=E
colormap=magma

nlive=1000
Nthreads=1

FixSeed=1
seed=42

input_spectrum=data_spectrum.npz

checkpoint=1
checkpoint_interval=1800

sample_method=rslice

out_dir=./Storage/L2_iso_plus_quad/