[params]
## Thesis-speed L2-only absolute-amplitude counterpart to paper_absmultipoles_l2_grid_thesis_fast.ini.
##
## Relative workflow:
## MPLCONFIGDIR=/tmp/mpl python blip/tools/run_relmultipoles_paper_grid.py paper_relmultipoles_l2_grid_thesis_fast_l2only_1e-3_5e-3.ini
##
## Absolute workflow:
## MPLCONFIGDIR=/tmp/mpl python blip/tools/run_absmultipoles_paper_grid.py paper_absmultipoles_l2_grid_thesis_fast_l2only_1e-3_5e-3.ini
##
## This preserves the native full-dataset absolute workflow:
## - 5 complete shared datasets are generated directly
## - no nuisance multipoles are injected
## - each dataset is recovered with the null and alt models
## - only the final dataset's null and alt recoveries keep full plotting outputs

fmin=1e-3
fmax=5e-3

## Four-year observation for stronger injected/recovered SNR in the thesis sweep.
duration=1.26144e8

## Use the established long-run production cadence already present elsewhere in the repo.
seglen=1e5
## Keep the Nyquist comfortably above the analysis band while reducing time-series cost.
fs=0.02

Shfile=LISA_2017_PSD_M.npy

## Higher-resolution response integration requested for this duplicated workflow.
nside=4
tstart = 0

lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain

## Paper reference frequency at 2.5 mHz.
fref = 2.5e-3

## Native full-dataset absolute model family.
model=noise+powerlaw_absmultipoles
alias={'powerlaw_absmultipoles':'powerlaw_absmultipoles'}

## No nuisance injected multipoles: only L=2 participates in the ramped datasets.
lmax = 2
multipole_ls = [2]


[inj]
## These truevals define the L2-only injected absolute dataset family.
doInj=1
injection=noise+powerlaw_absmultipoles
multipole_ls = [2]
inj_lmax = 2

truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_absmultipoles':{'alpha':0.667,
                                      'omega0':1e-10,
                                      'A_L_by_L':{2:1e-12}}
           }


[absolute_injection]
## Legacy component-workflow section retained for compatibility with the old launcher branch.
## The native full-dataset workflow above uses [inj] truevals instead.
multipole_ls = [2]

## A_2 is overwritten by the paper grid below on a per-dataset basis.
A_L_by_L = {2:1e-12}

## Use the same spectral slope for the absolute multipole component.
alpha = 0.667

## Per-L component seeds are offset from the dataset seed by this stride.
component_seed_stride = 100


[priors]
## Preserve the current paper noise/isotropic priors, and use an absolute A_L prior
## wide enough to cover the full paper scan while remaining much narrower than the
## legacy single-multipole examples.
log_Np=[-41.8,-40.2]
log_Na=[-49.2,-47.7]
alpha=[-0.5,1.5]
log_omega0=[-11.0,-9.0]
log_A_L=[-14.0,-10.0]


[run_params]
sampler=dynesty
verbose=1
doPreProc=1
generate_only=1
## Skip sweep-wide diagnostic / posterior plotting; the launcher re-enables
## diagnostics for the final shared dataset and full plotting for the final
## null and alt recoveries so you still get the thesis outputs where needed.
skip_diagnostics=1
skip_postprocessing=1
projection=E
colormap=magma

## Keep this laptop-friendly while still allowing parallel response work.
nlive=192
Nthreads=4
FixSeed=1
seed=200
input_spectrum=data_spectrum.npz
checkpoint=0
checkpoint_interval=1800
sample_method=rslice
response_time_chunk=256
response_storage_dtype=complex64
out_dir=./Storage/paper_absmultipoles_l2_grid_thesis_fast_l2only_1e-3_5e-3/


[paper_grid]
workflow_mode = full_dataset
target_multipole_l = 2

## Exact absolute counterparts to the ratio grid [1e-2, 2e-2, 1e-1, 2e-1]
## with omega0 = 1e-10.
A_L_grid = [1e-12,2e-12,1e-11,2e-11]

include_zero_baseline = 1
seed_start = 200
final_dataset_full_plots = 1
