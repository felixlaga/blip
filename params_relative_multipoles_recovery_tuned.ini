[params]
## Model-consistent parameter-recovery study for the relative-multipole total-power model.
## Unlike params_relative_multipoles_l10.ini, this injects the same power-spectrum family that it recovers.
## It also fits only the even-L terms that carry appreciable power in the current synthetic benchmark.

fmin=4e-4
fmax=3e-3
duration=8e5
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=4
tstart = 0
lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 1e-3

model=noise+powerlaw_multipoles
alias={'powerlaw_multipoles':'powerlaw_multipoles'}

## Keep lmax >= max(relative_multipole_ls) for internal response bookkeeping.
lmax = 8
relative_multipole_ls = [2,4,6,8]


[inj]
doInj=1
injection=noise+powerlaw_multipoles
inj_lmax = 8

## These ratios match the dominant total-power multipoles induced by the previous coherent-sky benchmark.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_multipoles':{'alpha':0.667,
                                   'omega0':5e-8,
                                   'A_ratios':{2:2.2430793934550172e-1,
                                               4:3.207861993552341e-2,
                                               6:1.7937642407174072e-3,
                                               8:4.711443607206442e-5}}
           }


[priors]
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]
alpha=[-0.5,1.5]
log_omega0=[-9.5,-6.0]
log_A_ratio=[-6.0,0.5]

## Weakly informative shrinkage prior in log-space to stabilise weak amplitudes without fixing them.
log_A_ratio_prior=truncnorm
log_A_ratio_mean=[-0.8,-1.6,-2.8,-4.0]
log_A_ratio_sigma=[0.9,0.9,1.0,1.0]


[run_params]
sampler=dynesty
verbose=1
doPreProc=1

projection=E
colormap=magma
nlive=600
Nthreads=1
FixSeed=1
seed=42

input_spectrum=relative_multipoles_recovery_tuned.npz

checkpoint=0
sample_method=rslice

out_dir=./Storage/relative_multipoles_recovery_tuned/
