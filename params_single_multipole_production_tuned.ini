[params]
## Production-style single-multipole run for results after debugging.
## Relative to the fast debug files: longer duration, more robust sampling, finer response integration,
## and reasonable priors without reverting to extremely broad defaults.
## Keep multipole_l configurable here, but default it to L=2.
fmin=4e-4
fmax=3e-3
## Longer duration for steadier posteriors while staying within the existing BLIP workflow.
duration=2e6
## Keep the segment length used by the existing production example.
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
## Finer angular integration than the fast configs.
nside=4
tstart = 0

lisa_config=orbiting
tdi_lev=xyz

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain

# Reference frequency for the power-law amplitude.
fref = 1e-3


## Recovery Model description
model=noise+powerlaw_multipole

## Model/Injection aliasing
alias={'powerlaw_multipole':'powerlaw_multipole'}

## Legacy spherical-harmonic bookkeeping.
lmax = 1
multipole_l = 2


[inj]
## Injections
doInj=1

## Injection model description
injection=noise+powerlaw_multipole

## Production-style baseline injection.
## Unlike the debug files, this returns to the weaker baseline amplitude.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_multipole':{'alpha':0.667,'A_L':2e-7}
           }


[priors]
## Reasonable production priors: narrower than the legacy defaults, but still broad enough for inference.
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]
alpha=[-1.0,2.5]
log_A_L=[-9.5,-5.5]


[run_params] # Parameters related to the run or to the sampler

## More robust sampler settings than the fast debugging runs.
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma
nlive=600
Nthreads=1

## Reproducible run
FixSeed=1
seed=42
input_spectrum=data_spectrum.npz

## Checkpointing and restarting (dynesty only)
checkpoint=0
checkpoint_interval=600

## Sampling method (dynesty only)
sample_method=rslice

## output directory
out_dir=./Storage/single_multipole_production_tuned/
