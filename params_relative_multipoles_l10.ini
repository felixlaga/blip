[params]
## Recover one shared isotropic spectrum plus relative total-power amplitudes A_L / A_0 for L=1..10.
## The recovery model is analysis-only; inject a chosen anisotropic sky via powerlaw_sph below.

fmin=4e-4
fmax=3e-3
duration=8e5
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=4
tstart = 0
lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 1e-3

model=noise+powerlaw_multipoles
alias={'powerlaw_multipoles':'powerlaw_sph'}

## Maximum recovery multipole included in
## C_gw = S_gw(f; alpha, log10 Omega0) [R_iso + sum_{L=1}^{lmax} 10^{log10(A_L/A_0)} R^(L)].
lmax = 10


[inj]
doInj=1
injection=noise+powerlaw_sph

## Only the injection sky needs explicit spherical-harmonic coefficients.
## This example injects structure through L=4, so the recovery should prefer low L
## and push L>4 toward small relative amplitudes.
inj_lmax = 4

## blm order for inj_lmax=4:
## b00, b10, b20, b30, b40, b11, b21, b31, b41, b22, b32, b42, b33, b43, b44
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_sph':{'alpha':0.667,
                            'omega0':5e-8,
                            'blms':[1.0,
                                    0.0,
                                    0.45,
                                    0.0,
                                    0.18,
                                    0.0,
                                    0.18+0.12j,
                                    0.0,
                                    0.05-0.04j,
                                    0.10j,
                                    0.0,
                                    0.04,
                                    0.0,
                                    0.03j,
                                    0.02-0.01j]}
           }


[priors]
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]
alpha=[-1.0,2.5]
log_omega0=[-10.0,-5.0]
log_A_ratio=[-5.0,2.0]


[run_params]
sampler=dynesty
verbose=1
doPreProc=1

projection=E
colormap=magma
nlive=600
Nthreads=1
FixSeed=1
seed=42

input_spectrum=relative_multipoles_l10.npz

checkpoint=0
sample_method=rwalk

out_dir=./Storage/relative_multipoles_l10/
