[params]
fmin=4e-4
fmax=3e-3
duration=3e5
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=1
tstart = 0
lisa_config=orbiting
tdi_lev=aet

load_data=0
datafile=mldc_tdi_withnoise.txt
datatype=strain
fref = 1e-3

model=noise+powerlaw_isgwb+powerlaw_multipole
alias={'powerlaw_isgwb':'powerlaw_isgwb',
       'powerlaw_multipole':'powerlaw_multipole'}

lmax = 2
multipole_l = 2


[inj]
doInj=1
injection=noise+powerlaw_isgwb+powerlaw_multipole
multipole_l = 2

truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_isgwb':{'alpha':0.667,'omega0':5e-8},
            'powerlaw_multipole':{'alpha':0.667,'A_L':2e-7}
           }


[priors]
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]
alpha=[-1.0,2.5]
log_omega0=[-10.0,-5.0]
log_A_L=[-9.5,-5.5]


[run_params]
sampler=dynesty
verbose=1
doPreProc=1
projection=E
colormap=magma
nlive=150
Nthreads=1
FixSeed=1
seed=42
input_spectrum=shared_spectrum_L2_fast.npz
checkpoint=0
sample_method=rslice
out_dir=./Storage/inject_iso_plus_L2_fast/