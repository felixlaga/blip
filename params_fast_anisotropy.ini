[params]
## General run parameters tuned for a quick anisotropic sanity check.
fmin=3e-4
fmax=2e-3
duration=2e5
seglen=5e4
fs=0.25
Shfile=LISA_2017_PSD_M.npy
## Healpix nside (skymap resolution)
nside=1
## Start time in seconds. Determines starting orbital position.
tstart=0

## LISA configuration. Can be stationary or orbiting
lisa_config=orbiting

## Level of the TDI. Can be michelson, xyz or aet
tdi_lev=xyz

## Generate synthetic data rather than loading a file
load_data=0

## Autogenerated data is strain. Can be doppler or strain.
datatype=strain

## fref parameter useful for power-law stochastic backgrounds
fref=25

## Recovery model
# Use truncatedpowerlaw_sph here: the hyphenated spelling shown in some comments
# does not match the parser implementation.
model=noise+powerlaw_isgwb+truncatedpowerlaw_sph

## Model/Injection aliasing
alias={'powerlaw_isgwb':'powerlaw_isgwb','truncatedpowerlaw_sph':'truncatedpowerlaw_sph'}

## Spherical harmonic lmax for the b_lms (a_lmax/2)
lmax=1


[inj]
## Injections
doInj=1

## Injection model description
injection=noise+powerlaw_isgwb+truncatedpowerlaw_sph

## Injection blmax. Match the recovery basis to keep the run light.
inj_lmax=1

## Trueval dictionary
# For blmax = 1, blms = b00, b10, b11
truevals={'noise':{'Np':9e-42,'Na':3.6e-49},
          'powerlaw_isgwb':{'alpha':0.667,'omega0':3e-8},
          'truncatedpowerlaw_sph':{'alpha':0.0,'omega0':2e-8,'fcut':1.1e-3,'fscale':2.5e-4,'blms':[1.0,0.2,0.15j]}}


[run_params]
## Parameters related to the run or to the sampler
sampler=dynesty
verbose=1
## Reuse cached data if it exists in the output directory
doPreProc=0
projection=E
colormap=magma
## Lower live-point count for a faster sanity run, not for production posteriors
nlive=150
Nthreads=1
FixSeed=1
seed=42
input_spectrum=data_spectrum.npz
checkpoint=0
sample_method=rslice
out_dir=./Storage/fast_anisotropy_truncatedpowerlaw_sph/
