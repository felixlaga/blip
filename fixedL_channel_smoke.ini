[params]
## General run parameters
fmin=8e-4
fmax=5e-3
## Duration in seconds, kept short for a fast end-to-end smoke run
duration=8e5
## Segment length for fft in seconds
seglen=1e5
## Sample rate in Hz
fs=0.25
Shfile=LISA_2017_PSD_M.npy
## Healpix nside used for the anisotropic response integration
nside=2
## Start time in seconds. Determines starting orbital position.
tstart = 0

## LISA configuration. Can be stationary or orbiting
lisa_config=orbiting

## Level of the tdi. The fixed-L channel mode currently supports only AET.
tdi_lev=aet

## If the load_data flag is set to 1, then the time series data is read in from a file.
load_data=0
datafile=mldc_tdi_withnoise.txt

## Doppler or strain data. MLDC data is doppler, autogenerated data is strain. Can be doppler or strain.
datatype=strain

## Legacy isotropic reference frequency; the fixed-L mode uses fixedL_fc instead.
fref = 2.5e-3

## Recovery Model description
model=noise+powerlaw_fixedLchannels

## Model/Injection aliasing
alias={'powerlaw_fixedLchannels':'powerlaw_fixedLchannels'}

## Legacy spherical-harmonic bookkeeping.
lmax = 1

## Dedicated fixed-L channel-likelihood configuration
fixedL = 2
fixedL_fc = 2.5e-3
fixedL_variance_model = theory_square


[inj]
## Injections
doInj=1

## Injection model description
injection=noise+powerlaw_fixedLchannels
## Build the averaged fixed-L data product directly for a fast, recoverable integration test.
fixedL_injection_mode=mean_rmat

## If inj.fixedL is omitted, the injection reuses params.fixedL.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_fixedLchannels':{'log10_Ac':-10.5,'alpha':0.5}
           }


[priors]
## Uniform prior bounds for the sampled parameters
log10_Ac=[-13.0,-9.0]
alpha=[-3.0,3.0]
log_Np=[-43.0,-40.0]
log_Na=[-50.0,-47.0]


[run_params] # Parameters related to the run or to the sampler

## Sampler to use. Supported: dynesty, emcee, nessai
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma
nlive=80
Nthreads=1

## Reproducible run
FixSeed=1
seed=42
input_spectrum=data_spectrum.npz

## Checkpointing and restarting (dynesty only)
checkpoint=0
checkpoint_interval=600

## Sampling method (dynesty only)
sample_method=rwalk

## output directory
out_dir=./Storage/fixedL_channel_smoke/
