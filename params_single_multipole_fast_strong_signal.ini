[params]
## Fast debugging run for the single-multipole total-power model.
## Goal: make the injected L=2 anisotropy easier to recover without changing code.
## Relative to the existing fast example: stronger injected A_2, sensible fref, and a mHz-focused band.
## Alpha is free in this run.
fmin=5e-4
fmax=3e-3
## Keep the run cheap while still averaging over several segments.
duration=4e5
## Segment length for fft in seconds.
seglen=1e5
## Sample rate in Hz.
fs=0.25
Shfile=LISA_2017_PSD_M.npy
## Healpix nside used for the anisotropic response integration.
nside=1
## Start time in seconds. Determines starting orbital position.
tstart = 0

## LISA configuration. Can be stationary or orbiting.
lisa_config=orbiting

## Level of the tdi. Can be michelson, xyz or aet.
tdi_lev=aet

# If the load_data flag is set to 1, then the time series data is read in from a file.
load_data=0
datafile=mldc_tdi_withnoise.txt

# Doppler or strain data. MLDC data is doppler, autogenerated data is strain. Can be doppler or strain.
datatype=strain

# Reference frequency for the power law amplitude.
# Use 1 mHz instead of the isotropic default of 25 Hz.
fref = 1e-3


## Recovery Model description
model=noise+powerlaw_multipole

## Model/Injection aliasing
alias={'powerlaw_multipole':'powerlaw_multipole'}

## Legacy spherical-harmonic bookkeeping.
## The fixed single multipole for this run is controlled by multipole_l.
lmax = 1
multipole_l = 2


[inj]
## Injections
doInj=1

## Injection model description
injection=noise+powerlaw_multipole

## Strong-signal debug injection.
## A_2 is increased by 10x relative to the 2e-7 baseline example.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_multipole':{'alpha':0.667,'A_L':2e-6}
           }


[priors]
## Moderate, physically sensible priors for a fast identifiability check.
## Priors are narrower than the legacy defaults but still leave alpha free.
log_Np=[-43.0,-40.0]
log_Na=[-49.8,-47.0]
alpha=[-1.0,2.5]
log_A_L=[-9.0,-5.0]


[run_params] # Parameters related to the run or to the sampler

## Sampler to use. Supported: dynesty, emcee, nessai.
## Keep this short and cheap for debugging.
sampler=dynesty
verbose=1
doPreProc=0
projection=E
colormap=magma
nlive=100
Nthreads=1

## Reproducible run
FixSeed=1
seed=42
input_spectrum=data_spectrum.npz

## Checkpointing and restarting (dynesty only)
checkpoint=0
checkpoint_interval=600

## Sampling method (dynesty only)
sample_method=rwalk

## output directory
out_dir=./Storage/single_multipole_fast_strong_signal/
