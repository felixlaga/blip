[params]
## Fast direct-a_lm recovery example.
fmin=4e-4
fmax=3e-3
duration=5e5
seglen=1e5
fs=0.25
Shfile=LISA_2017_PSD_M.npy
nside=4
tstart=0
lisa_config=orbiting
tdi_lev=aet
load_data=0
datatype=strain
datafile=mldc_tdi_withnoise.txt
fref=25

## Recovery model
## spatial models available: isgwb, sph, alm
model=noise+powerlaw_alm
alias={'powerlaw_alm':'powerlaw_alm'}

## Legacy b_lm lmax, still kept for compatibility with the shared sph infrastructure.
lmax=2
## Actual direct power-map lmax for the sampled a_lm coefficients.
alm_lmax=2
## Uniform prior half-width for every sampled direct a_lm coefficient.
alm_prior_bound=0.15

[inj]
doInj=1
injection=noise+powerlaw_alm
inj_alm_lmax=2

## Direct a_lm injections are specified in healpy alm order (m >= 0 only):
## [a00, a10, a20, a11, a21, a22] for alm_lmax = 2.
## Negative-m coefficients are implied by the real-map symmetry a_{l,-m} = (-1)^m a_{lm}^*.
## The code renormalizes the list so that a00 = 1/sqrt(4*pi), keeping the overall SGWB amplitude in omega0.
truevals = {'noise':{'Np':9e-42,'Na':3.6e-49},
            'powerlaw_alm':{'alpha':0.667,
                            'omega0':2e-7,
                            'alms':[0.28209479177387814,
                                    0.03,
                                    -0.015,
                                    0.01+0.004j,
                                    0.005-0.003j,
                                    -0.006+0.002j]}}

[run_params]
sampler=dynesty
nlive=300
FixSeed=1
seed=42
Nthreads=1
projection=E
out_dir=./Storage/direct_alm_fast/
